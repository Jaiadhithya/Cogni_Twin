name: CI

on:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/backend.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: cognitwin
          POSTGRES_USER: cognitwin_user
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cognitwin_user -d cognitwin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://cognitwin_user:postgres@127.0.0.1:5432/cognitwin
      DATABASE_READONLY_URL: postgresql+asyncpg://cognitwin_readonly:readonly@127.0.0.1:5432/cognitwin
      # Dummy key: the suite never reaches the real LLM; every LLM path has a deterministic fallback.
      GROQ_API_KEY: ci-dummy-key
      TESTING: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13" # keep in step with backend/Dockerfile
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Create read-only role (same script docker-compose runs)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=postgres psql -h 127.0.0.1 -U cognitwin_user -d cognitwin -v ON_ERROR_STOP=1 -f scripts/init_db.sql

      - name: Apply migrations
        run: alembic upgrade head

      - name: Migration downgrade/upgrade round trip (every revision)
        run: |
          alembic downgrade base
          alembic upgrade head

      # Qdrant is not started: the suite swaps in an in-memory vector store when no server is reachable.
      - name: Run tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx jest
      - run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      # Runs against a production build in Demo mode, so it needs no backend.
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
