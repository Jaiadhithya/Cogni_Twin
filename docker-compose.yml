version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cognitwin-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cognitwin}
      POSTGRES_USER: ${POSTGRES_USER:-cognitwin_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init_db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cognitwin_user} -d ${POSTGRES_DB:-cognitwin}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: cognitwin-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cognitwin-backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://cognitwin_user:postgres@db:5432/cognitwin}
      DATABASE_READONLY_URL: ${DATABASE_READONLY_URL:-postgresql+asyncpg://cognitwin_readonly:readonly@db:5432/cognitwin}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL_NAME: ${GROQ_MODEL_NAME:-openai/gpt-oss-120b}
      ML_MODELS_DIR: /app/ml_models
      UPLOAD_DIR: /app/uploads
      LOG_LEVEL: INFO
      CORS_ORIGINS: '["http://localhost:3000"]'
      QDRANT_HOST: qdrant
      API_KEY: ${API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ml_models:/app/ml_models
      - uploads:/app/uploads
      - ./backend/src:/app/src
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_API_URL: http://backend:8000/api/v1
    container_name: cognitwin-frontend
    environment:
      BACKEND_API_URL: http://backend:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  ml_models:
  uploads:
  qdrant_data:
